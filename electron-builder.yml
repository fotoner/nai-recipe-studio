appId: com.fotoner.nai-recipe-studio
productName: NAI Recipe Studio
directories:
  output: release
files:
  - dist/main/**
  - dist/preload/**
  - dist/renderer/**
  - package.json
asar: true
asarUnpack:
  - node_modules/better-sqlite3/**
extraResources:
  - from: skills/recipe-studio
    to: skills/recipe-studio
  - from: desktop/release/manifest.json
    to: manifest.json
  - from: desktop/release/licenses
    to: licenses
  - from: LICENSE
    to: licenses/LICENSE
npmRebuild: true
afterPack: ./scripts/after-pack.cjs
publish: null
artifactName: ${name}-${version}-${os}-${arch}.${ext}
mac:
  identity: "-"
  entitlements: desktop/release/entitlements.mac.plist
  entitlementsInherit: desktop/release/entitlements.mac.plist
  icon: desktop/assets/icon.png
  category: public.app-category.graphics-design
  hardenedRuntime: true
  gatekeeperAssess: false
  target:
    - dmg
    - zip
win:
  icon: desktop/assets/icon.ico
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
linux:
  icon: desktop/assets/icon.png
  category: Graphics
  executableName: nai-recipe-studio
  maintainer: fotoner <fotoner@users.noreply.github.com>
  synopsis: NovelAI prompt recipe editor and generation manager
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
